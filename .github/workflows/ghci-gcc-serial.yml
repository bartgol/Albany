name: debug-advdiff-adapt

# DO NOT MERGE: temporary workflow to investigate flakiness of
# corePDEs_AdvDiff_2d_adapt_omegah_Serial

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  debug:
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/sandialabs/albany:gcc-12-serial
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          path: albany/source
      - name: Setup GIT
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
      - name: Configure Albany
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/albany/build && cd ${GITHUB_WORKSPACE}/albany/build
          cmake \
            -D CMAKE_BUILD_TYPE:STRING=RELEASE                                \
            -D ALBANY_TRILINOS_DIR:PATH=${TRILINOS_ROOT}                      \
            -D ALBANY_MPI_EXEC_MAX_NUMPROCS:STRING=4                          \
            -D ALBANY_MPI_EXEC_TRAILING_OPTIONS:STRING="--bind-to hwthread"   \
            -D ALBANY_DISABLE_FAILING_TESTS:BOOL=ON                           \
            -D ENABLE_OMEGAH:BOOL=ON                                          \
            -D ENABLE_MESHFIELDS:BOOL=ON                                      \
            -D ENABLE_DEMO_PDES:BOOL=ON                                       \
            -D ENABLE_LANDICE:BOOL=ON                                         \
            -D ENABLE_MPAS_INTERFACE:BOOL=ON                                  \
            -S ${GITHUB_WORKSPACE}/albany/source
      - name: Print environment info
        run: |
          cd ${GITHUB_WORKSPACE}/albany/build
          echo "ALBANY SHA: $(git -C ${GITHUB_WORKSPACE}/albany/source rev-parse HEAD)"
          for d in tpls/omega_h/omega_h-src tpls/meshfields/meshfields-src; do
            echo "$d: $(git -C $d rev-parse HEAD 2>&1)"
          done
          echo "TRILINOS_ROOT=${TRILINOS_ROOT}"
          ls ${TRILINOS_ROOT}/include/Trilinos_version.h 2>/dev/null && grep -m3 "TRILINOS_MAJOR\|TRILINOS_MINOR\|Trilinos_VERSION" ${TRILINOS_ROOT}/include/Trilinos_version.h
          echo "Image digest info:"; cat /etc/os-release | head -2
      - name: Build Albany
        run: |
          cd ${GITHUB_WORKSPACE}/albany/build
          make -j 4
      - name: Repeat the test
        run: |
          cd ${GITHUB_WORKSPACE}/albany/build
          for i in $(seq 1 15); do
            echo "=== repeat $i"
            ctest -R 'corePDEs_AdvDiff_2d_adapt_omegah' --output-on-failure 2>&1 \
              | grep -E "Test +#|Response Test|^ +-?[0-9]\.[0-9]+e[-+][0-9]+$|MeanValue|tests passed" || true
          done
